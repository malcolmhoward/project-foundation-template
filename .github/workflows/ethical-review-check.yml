name: Ethical Review Check

# Confirms that a PR description contains the ethical review sections from the PR
# template. It deliberately does not check which boxes are ticked: the PR's author can
# edit the description, so a ticked box here proves nothing. The reviewer's sign-off is
# the approving review that branch protection requires, and the Reviewer Verification
# boxes record the reviewer's judgement.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  check-ethical-review:
    name: Validate Ethical Review Sections
    runs-on: ubuntu-latest

    steps:
      - name: Check PR Description for Ethical Review
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';

            // Sections every PR description must contain
            const requiredSections = [
              { pattern: /## Ethical Review/i,
                message: 'PR description must contain an "## Ethical Review" section' },
              { pattern: /### Contributor Self-Assessment/i,
                message: 'PR description must contain a "### Contributor Self-Assessment" section' },
              { pattern: /### Reviewer Verification/i,
                message: 'PR description must contain a "### Reviewer Verification" section' },
            ];

            // Items that must be present, ticked or not
            const requiredItems = [
              { pattern: /- \[[ xX]\] Principle Zero test completed/,
                message: 'Missing contributor item: "Principle Zero test completed"' },
              { pattern: /- \[[ xX]\] Ethical Pause taken/,
                message: 'Missing contributor item: "Ethical Pause taken"' },
              { pattern: /- \[[ xX]\] Identified risks have mitigations/,
                message: 'Missing contributor item: "Identified risks have mitigations"' },
              { pattern: /\*\*New concerns found during implementation\*\*:/,
                message: 'Missing contributor line: "New concerns found during implementation"' },
              { pattern: /- \[[ xX]\] The Principle Zero and Ethical Pause sections are complete/,
                message: 'Missing reviewer item: "The Principle Zero and Ethical Pause sections are complete"' },
              { pattern: /- \[[ xX]\] Every identified risk has a mitigation or a documented justification/,
                message: 'Missing reviewer item: "Every identified risk has a mitigation or a documented justification"' },
              { pattern: /- \[[ xX]\] Educational value preserved/,
                message: 'Missing reviewer item: "Educational value preserved"' },
              { pattern: /- \[[ xX]\] Independently reviewed by someone other than the author/,
                message: 'Missing reviewer item: "Independently reviewed by someone other than the author"' },
            ];

            const errors = requiredSections.filter(s => !s.pattern.test(prBody)).map(s => s.message);
            if (errors.length === 0) {
              errors.push(...requiredItems.filter(i => !i.pattern.test(prBody)).map(i => i.message));
            }

            const warnings = [];
            const concerns = prBody.match(/\*\*New concerns found during implementation\*\*:[ \t]*(.*)/);
            if (concerns && concerns[1].replace(/<!--.*?-->/g, '').trim() === '') {
              warnings.push('"New concerns found during implementation" is empty: write "None" or list them.');
            }
            const summary = prBody.match(/\*\*Summary of Ethical Considerations\*\*:\s*\n([^\n*#-]*)/i);
            if (summary && summary[1].trim().length < 20) {
              warnings.push('Summary of Ethical Considerations appears incomplete. Please provide a meaningful summary.');
            }

            if (errors.length > 0) {
              core.setFailed([
                '## Ethical Review Validation Failed',
                '',
                'This PR description is missing parts of the ethical review. Use the PR template, which includes them all.',
                '',
                '### Missing:',
                ...errors.map(e => `- ${e}`),
                '',
                'See docs/ethical-review/README.md for guidance.',
              ].join('\n'));
            } else if (warnings.length > 0) {
              for (const w of warnings) core.warning(w);
              console.log('Ethical review sections present, with warnings.');
            } else {
              console.log('Ethical review sections present.');
            }
