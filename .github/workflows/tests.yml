name: Tests

# Runs PFT's test suite on pull requests and on pushes to main.
# macOS is included because the generated secrets hook must work with BSD grep and
# sed there, and with the system bash (3.2): PFT_TEST_BASH points the tests that run
# the hook directly at /bin/bash, since the runner's PATH puts a newer Homebrew bash
# first. pre-commit is installed so the hook is also tested the way the generated
# .pre-commit-config.yaml runs it; that test uses the bash found on PATH.
# One Python version on two systems keeps the run short.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt pre-commit

      - name: Run tests
        env:
          PFT_TEST_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || '' }}
        run: python -m pytest -q
